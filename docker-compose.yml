name: para-dhiver

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: para_dhiver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Loopback only. The backend reaches Postgres over the compose network;
      # this mapping exists for a database client on the host, and on a server
      # it published the database to every machine on the network — where the
      # compose defaults are postgres/postgres. Reach it remotely with an SSH
      # tunnel instead: ssh -L 5433:127.0.0.1:5433 <host>
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d para_dhiver']
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache and lock for the idempotency layer — never the source of truth for
  # it. PostgreSQL's unique constraint on idempotency_keys is what actually
  # stops a double checkout; this only saves the round trip. Stop this service
  # and orders keep working, slightly slower. See backend/src/services/redis.ts.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly so a restart does not drop in-flight locks and cached
    # responses. Losing them is survivable — every read falls through to
    # Postgres — but a needless cold cache after every deploy is not free.
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    # Deliberately no `ports:`. Redis has no password here and its whole
    # surface is reachable from the compose network only, which is the same
    # posture Postgres has above minus the loopback convenience mapping.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:latest
    restart: always
    ports:
      # Loopback only. Adminer is a database administration console; on the
      # network it was one form away from full access to the data, guarded by
      # nothing but the compose default credentials. Same tunnel as above.
      - '127.0.0.1:8080:8080'
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    # Only values that describe Docker's own topology belong here. `environment:`
    # overrides `env_file:`, so anything listed is a value backend/.env can no
    # longer set — FRONTEND_URL and SERVER_URL used to be pinned to localhost
    # here, which silently discarded the real origins on every deployment that
    # is not a developer's laptop, and left Payload computing CORS, CSRF and
    # its own admin links against an address no browser was using.
    environment:
      # Parameterised, with the bootstrap superuser as the fallback so an
      # unconfigured checkout keeps working. To adopt the least-privilege role,
      # run backend/db/security/001-app-role.sql and then set DATABASE_URI in a
      # .env next to this file:
      #   DATABASE_URI=postgresql://para_app:<password>@postgres:5432/para_dhiver
      # See backend/db/security/README.md for the rollout order — flipping this
      # before the role exists takes the backend down.
      DATABASE_URI: ${DATABASE_URI:-postgresql://postgres:postgres@postgres:5432/para_dhiver}
      #
      # FRONTEND_URL deliberately NOT set here, though the branch being merged
      # added it. `environment:` overrides `env_file:`, so pinning it to
      # localhost is exactly the bug the comment above this block records
      # having fixed: it silently discards the real origin on every deployment
      # that is not a developer's laptop, and leaves Payload computing CORS,
      # CSRF and its own admin links against an address no browser is using.
      # Container-to-container address for the cache purge. FRONTEND_URL stays
      # the browser-facing origin (it backs CORS/CSRF), and inside this
      # container "localhost:3000" would resolve to the backend itself.
      STOREFRONT_INTERNAL_URL: http://frontend:3000
      # Service name, like DATABASE_URI above. Unset this and the backend
      # runs with no cache at all, which is a supported mode.
      REDIS_URL: redis://redis:6379
      PORT: '3001'
    ports:
      # Loopback only. Caddy reaches this over the compose network, not through
      # a host port, so publishing it to every interface only exposed an origin
      # that has no TLS and whose dashboard login cannot work over plain HTTP.
      # `localhost:3001` still resolves for local development.
      - '127.0.0.1:3001:3001'
    volumes:
      # Uploads live here whenever Cloudinary is not configured. Without a
      # volume they sit in the container's writable layer, and every
      # `up --build` destroys them while the media rows in Postgres survive —
      # leaving a database full of records whose files are gone and a backend
      # answering 500 on its own images. That is not hypothetical: it is what
      # happened to the thirteen files the seed wrote.
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      # Started with the backend, but not required by it: the idempotency
      # layer treats an unreachable Redis as a cache miss. `service_started`
      # rather than `service_healthy` so a sick cache can never hold up a
      # deploy of the shop.
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./frontend/.env.local
    environment:
      CMS_URL: http://backend:3001
      PORT: '3000'
      # Shared secret for the CMS -> storefront cache purge (/api/revalidate).
      # Taken from the host environment (or a .env beside this file), never
      # committed — it must match REVALIDATE_SECRET in backend/.env. Left
      # unset it stays empty, /api/revalidate answers 503 and the storefront
      # caches expire on their own timer, which is the intended degradation.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
    ports:
      # Loopback only — see the backend service above.
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  redisdata:
