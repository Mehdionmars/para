name: para-dhiver

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: para_dhiver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d para_dhiver']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URI: postgresql://postgres:postgres@postgres:5432/para_dhiver
      FRONTEND_URL: http://localhost:3000
      # Container-to-container address for the cache purge. FRONTEND_URL stays
      # the browser-facing origin (it backs CORS/CSRF), and inside this
      # container "localhost:3000" would resolve to the backend itself.
      STOREFRONT_INTERNAL_URL: http://frontend:3000
      SERVER_URL: http://localhost:3001
      PORT: '3001'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./frontend/.env.local
    environment:
      CMS_URL: http://backend:3001
      PORT: '3000'
      # Shared secret for the CMS -> storefront cache purge (/api/revalidate).
      REVALIDATE_SECRET: pdh-revalidate-d791fe064051b9ad4a8ed1d69db89074
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
