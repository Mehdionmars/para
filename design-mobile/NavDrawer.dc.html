<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Poppins:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #373020; font-family: "Poppins", system-ui, sans-serif; }
    a { color: #5e4074; text-decoration: none; }
    a:hover { color: #3b2650; }
    ul { margin: 0; padding: 0; list-style: none; }
    button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
    .kicker { font-family: "Raleway", sans-serif; font-size: 9.5px; font-weight: 600;
              letter-spacing: .16em; text-transform: uppercase; color: #6f6a63; }
    .navrow { display: flex; align-items: center; justify-content: space-between; width: 100%;
              min-height: 54px; padding: 0 18px; font-family: "Jost", sans-serif; font-size: 17px;
              font-weight: 400; color: #373020; text-align: left; }
    .subrow { display: block; width: 100%; min-height: 46px; padding: 0 18px 0 32px;
              font-size: 13.5px; color: #4c5560; text-align: left; }
    .util { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px;
            padding: 0 18px; font-size: 13.5px; color: #373020; text-align: left; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; background: rgba(55,48,32,.45); overflow: hidden">

  <div style="position: absolute; inset: 0 62px 0 0; background: #fff; display: flex; flex-direction: column; box-shadow: 8px 0 30px -10px rgba(55,48,32,.4)">

    <div style="display: flex; align-items: center; gap: 9px; padding: 14px 18px; border-bottom: 1px solid rgba(55,48,32,.08); flex: none">
      <img src="logo.png" alt="" width="36" height="36" style="flex: none; object-fit: contain">
      <span style="flex: 1; font-family: 'Jost', sans-serif; font-size: 14px; font-weight: 400; letter-spacing: .17em; color: #5e4074">PARA D&#39;HIVER</span>
      <button aria-label="Fermer" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#373020" stroke-width="1.7" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div style="padding: 14px 18px; flex: none">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 15px; border-radius: 999px; background: rgba(55,48,32,.06)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6a7178" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span style="font-size: 13.5px; color: #9a958d">Rechercher un produit</span>
      </div>
    </div>

    <div style="flex: 1; overflow-y: auto; padding-bottom: 8px">
      <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
        <div style="border-bottom: 1px solid rgba(55,48,32,.06)">
          <button class="navrow" onClick="{{ n.toggle }}" style="color: {{ n.color }}">
            <span>{{ n.label }}</span>
            <sc-if value="{{ n.hasKids }}" hint-placeholder-val="{{ true }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a958d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform: rotate({{ n.rot }}deg); transition: transform .22s ease"><path d="m6 9 6 6 6-6"/></svg>
            </sc-if>
          </button>
          <sc-if value="{{ n.open }}" hint-placeholder-val="{{ false }}">
            <ul style="padding-bottom: 10px">
              <sc-for list="{{ n.kids }}" as="k" hint-placeholder-count="4">
                <li><button class="subrow">{{ k.label }}</button></li>
              </sc-for>
            </ul>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div style="flex: none; border-top: 1px solid rgba(55,48,32,.1); padding: 10px 0 14px; background: #faf7f2">
      <button class="util">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5e4074" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        Mes favoris
        <span style="margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #5e4074; color: #fff; font-size: 10.5px; display: inline-flex; align-items: center; justify-content: center">3</span>
      </button>
      <button class="util">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5e4074" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3h13v13H1zM14 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/></svg>
        Suivre ma commande
      </button>
      <button class="util">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#008aa5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.9-.9L3 20.5l1.5-4.6A8.4 8.4 0 0 1 3.6 11 8.5 8.5 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>
        Conseil sur WhatsApp
      </button>
      <div style="display: flex; gap: 18px; padding: 12px 18px 0; margin-top: 6px; border-top: 1px solid rgba(55,48,32,.08)">
        <span class="kicker">Casablanca, Maroc</span>
      </div>
    </div>

  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const NAV = [
  { id: 'soldes', label: 'Soldes', accent: true, kids: ['Jusqu-à -50%', 'Ventes flash', 'Fins de série'] },
  { id: 'visage', label: 'Visage', kids: ['Nettoyants', 'Sérums', 'Crèmes hydratantes', 'Solaires', 'Anti-âge'] },
  { id: 'cheveux', label: 'Cheveux', kids: ['Shampooings', 'Soins', 'Anti-chute', 'Anti-pelliculaire'] },
  { id: 'corps', label: 'Corps', kids: ['Hydratation', 'Peaux atopiques', 'Mains et pieds', 'Hygiène'] },
  { id: 'bebe', label: 'Bébé & Maman', kids: ['Change', 'Bain', 'Allaitement'] },
  { id: 'complements', label: 'Compléments alimentaires', kids: ['Vitamines', 'Oméga 3', 'Immunité'] },
  { id: 'bucco', label: 'Bucco-dentaire', kids: ['Dentifrices', 'Brosses à dents', 'Bains de bouche'] },
  { id: 'marques', label: 'Toutes les marques', kids: [] },
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 'visage' };
  }

  renderVals() {
    return {
      nav: NAV.map((n) => {
        const isOpen = this.state.open === n.id;
        return {
          label: n.label,
          color: n.accent ? '#ff514d' : '#373020',
          hasKids: n.kids.length > 0,
          open: isOpen && n.kids.length > 0,
          rot: isOpen ? 180 : 0,
          kids: n.kids.map((k) => ({ label: k })),
          toggle: () => this.setState({ open: isOpen ? '' : n.id }),
        };
      }),
    };
  }
}
</script>
</body>
</html>
