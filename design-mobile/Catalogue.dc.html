<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Poppins:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #373020; font-family: "Poppins", system-ui, sans-serif; }
    a { color: #5e4074; text-decoration: none; }
    a:hover { color: #3b2650; }
    ul { margin: 0; padding: 0; list-style: none; }
    button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
    .scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .scroller::-webkit-scrollbar { display: none; }
    .chip { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px;
            border-radius: 999px; background: rgba(55,48,32,.06); color: #373020;
            font-family: "Raleway", sans-serif; font-size: 12.5px; font-weight: 500;
            letter-spacing: .01em; white-space: nowrap; }
    .chip[data-on="true"] { background: #5e4074; color: #fff; }
    .brandline { font-family: "Raleway", sans-serif; font-size: 9.5px; font-weight: 600;
                 letter-spacing: .16em; text-transform: uppercase; color: #6f6a63; margin-bottom: 6px; }
    .pname { font-family: "Jost", sans-serif; font-weight: 300; font-size: 15.5px; line-height: 1.3;
             color: #373020; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
             overflow: hidden; min-height: 41px; }
    .price { font-family: "Jost", sans-serif; font-weight: 400; font-size: 26px; letter-spacing: -.01em;
             line-height: 1; color: #5e4074; white-space: nowrap; }
    .price-old { font-size: 12.5px; color: #6f6a63; text-decoration: line-through; }
    .cta { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
           margin-top: auto; padding: 12px 2px 0; border-top: 1px solid rgba(94,64,116,.16);
           color: #5e4074; font-family: "Raleway", sans-serif; font-size: 10.5px; font-weight: 600;
           letter-spacing: .12em; text-transform: uppercase; text-align: left; min-height: 42px; }
    .fav { position: absolute; top: 4px; right: 4px; z-index: 3; width: 30px; height: 30px;
           border-radius: 50%; background: #fff; border: 1px solid rgba(94,64,116,.16);
           box-shadow: 0 2px 6px -2px rgba(55,48,32,.28); display: flex; align-items: center;
           justify-content: center; }
    .badge { display: inline-flex; align-items: center; background: #ff514d; color: #fff;
             font-size: 10.5px; font-weight: 600; letter-spacing: .06em; border-radius: 999px;
             padding: 5px 11px; }
    .fbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px;
            padding: 10px 14px; background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(55,48,32,.08); }
    .sheet-row { display: flex; align-items: center; justify-content: space-between; width: 100%;
                 min-height: 48px; font-size: 13.5px; }
    .box { width: 20px; height: 20px; border-radius: 4px; border: 1.5px solid rgba(94,64,116,.35);
           display: flex; align-items: center; justify-content: center; flex: none; }
    .box[data-on="true"] { background: #5e4074; border-color: #5e4074; }
  </style>
</helmet>

<div style="width: 390px; background: #fff; position: relative">

  <header style="display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid rgba(55,48,32,.08)">
    <button aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#373020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 style="flex: 1; font-family: 'Jost', sans-serif; font-weight: 300; font-size: 20px; color: #5e4074; margin: 0">Catalogue</h1>
    <button aria-label="Rechercher" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#373020" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
  </header>

  <div class="fbar">
    <button onClick="{{ openSheet }}" style="display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 15px; border-radius: 999px; border: 1px solid rgba(94,64,116,.28); color: #5e4074; font-family: 'Raleway', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .04em; flex: none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
      Filtrer
      <sc-if value="{{ hasFilters }}" hint-placeholder-val="{{ true }}">
        <span style="min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #5e4074; color: #fff; font-size: 10px; display: inline-flex; align-items: center; justify-content: center">{{ filterCount }}</span>
      </sc-if>
    </button>
    <ul class="scroller" style="flex: 1">
      <sc-for list="{{ quick }}" as="q" hint-placeholder-count="4">
        <li style="flex: none"><button class="chip" data-on="{{ q.on }}" onClick="{{ q.pick }}">{{ q.label }}</button></li>
      </sc-for>
    </ul>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 6px">
    <span style="font-size: 12.5px; color: #6a7178">{{ countLabel }}</span>
    <button onClick="{{ cycleSort }}" style="display: inline-flex; align-items: center; gap: 6px; font-family: 'Raleway', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5e4074; min-height: 40px">
      {{ sortLabel }}
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 14px; padding: 10px 14px 30px">
    <sc-for list="{{ items }}" as="p" hint-placeholder-count="6">
      <article style="display: flex; flex-direction: column; min-width: 0">
        <div style="position: relative; aspect-ratio: 1/1; margin-bottom: 14px">
          <img src="{{ p.img }}" alt="" style="width: 100%; height: 100%; object-fit: contain">
          <sc-if value="{{ p.onSale }}" hint-placeholder-val="{{ true }}">
            <span class="badge" style="position: absolute; top: 0; left: 0">{{ p.offLabel }}</span>
          </sc-if>
          <button class="fav" onClick="{{ p.toggleFav }}" aria-label="Favori">
            <svg width="15" height="15" viewBox="0 0 24 24" stroke="#5e4074" stroke-width="1.6" fill="{{ p.favFill }}" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
        </div>
        <div style="display: flex; flex-direction: column; flex: 1">
          <div class="brandline">{{ p.brand }}</div>
          <div class="pname">{{ p.name }}</div>
          <div style="display: flex; align-items: center; gap: 8px; min-height: 16px; margin-top: 5px; font-size: 11.5px; color: {{ p.metaColor }}">{{ p.meta }}</div>
          <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 8px">
            <span class="price">{{ p.price }}</span>
            <span class="price-old">{{ p.old }}</span>
          </div>
          <button class="cta" onClick="{{ p.add }}">
            <span>{{ p.ctaLabel }}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
          </button>
        </div>
      </article>
    </sc-for>
  </div>

  <sc-if value="{{ sheetOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; z-index: 20">
      <button onClick="{{ closeSheet }}" aria-label="Fermer" style="position: absolute; inset: 0; width: 100%; background: rgba(55,48,32,.45)"></button>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 18px 18px 0 0; padding: 8px 0 20px; box-shadow: 0 -8px 30px -10px rgba(55,48,32,.4)">
        <div style="width: 38px; height: 4px; border-radius: 999px; background: rgba(55,48,32,.18); margin: 6px auto 12px"></div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 18px 10px; border-bottom: 1px solid rgba(55,48,32,.08)">
          <h2 style="font-family: 'Jost', sans-serif; font-weight: 400; font-size: 18px; color: #5e4074; margin: 0">Filtrer</h2>
          <button onClick="{{ clearAll }}" style="font-family: 'Raleway', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #008aa5; min-height: 44px">Effacer</button>
        </div>

        <div style="padding: 14px 18px 0">
          <div style="font-family: 'Raleway', sans-serif; font-size: 9.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #6f6a63; margin-bottom: 4px">Marque</div>
          <sc-for list="{{ brandRows }}" as="b" hint-placeholder-count="4">
            <button class="sheet-row" onClick="{{ b.toggle }}">
              <span>{{ b.name }}</span>
              <span style="display: flex; align-items: center; gap: 10px">
                <span style="font-size: 12px; color: #9a958d">{{ b.count }}</span>
                <span class="box" data-on="{{ b.on }}">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
                </span>
              </span>
            </button>
          </sc-for>
        </div>

        <div style="padding: 14px 18px 0; border-top: 1px solid rgba(55,48,32,.08); margin-top: 8px">
          <div style="font-family: 'Raleway', sans-serif; font-size: 9.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #6f6a63; margin-bottom: 10px">Prix</div>
          <ul style="display: flex; gap: 8px; flex-wrap: wrap">
            <sc-for list="{{ priceRows }}" as="r" hint-placeholder-count="3">
              <li><button class="chip" data-on="{{ r.on }}" onClick="{{ r.pick }}">{{ r.label }}</button></li>
            </sc-for>
          </ul>
        </div>

        <div style="padding: 18px 18px 0">
          <button onClick="{{ closeSheet }}" style="width: 100%; min-height: 50px; border-radius: 999px; background: #5e4074; color: #fff; font-family: 'Raleway', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase">
            {{ applyLabel }}
          </button>
        </div>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":1420}}'>
const CATALOGUE = [
  { key: 'capital', brand: 'Vichy', name: 'Capital Soleil Crème Solaire Onctueuse SPF50+', price: 76, old: 108, size: '50 ml', img: 'capital-soleil.jpg', stock: 4 },
  { key: 'anthelios', brand: 'La Roche-Posay', name: 'Anthelios UVMune 400 Fluide Solaire Invisible', price: 115, old: 147, size: '50 ml', img: 'anthelios.jpg', stock: 20 },
  { key: 'effaclar', brand: 'La Roche-Posay', name: 'Effaclar Gel Moussant Purifiant', price: 226, old: 348, size: '400 ml', img: 'effaclar.jpg', stock: 12 },
  { key: 'lipikar', brand: 'La Roche-Posay', name: 'Lipikar Huile Lavante AP+', price: 152, old: null, size: '400 ml', img: 'lipikar.jpg', stock: 9 },
  { key: 'omega3', brand: 'Solgar', name: 'Oméga 3 Capsules', price: 270, old: null, size: '30 capsules', img: 'omega3.jpg', stock: 0 },
  { key: 'saforelle', brand: 'Saforelle', name: 'Soin Lavant Doux Apaisant', price: 38, old: null, size: '100 ml', img: 'saforelle.jpg', stock: 30 },
  { key: 'parodontax', brand: 'Parodontax', name: 'Dentifrice Complete Protection', price: 54, old: null, size: '75 ml', img: 'parodontax.jpg', stock: 15 },
];

const PRICE_BANDS = [
  { id: 'all', label: 'Tous les prix', test: () => true },
  { id: 'lo', label: 'Moins de 100 MAD', test: (p) => p.price < 100 },
  { id: 'mid', label: '100 – 200 MAD', test: (p) => p.price >= 100 && p.price <= 200 },
  { id: 'hi', label: 'Plus de 200 MAD', test: (p) => p.price > 200 },
];

const SORTS = [
  { id: 'pop', label: 'Populaires' },
  { id: 'asc', label: 'Prix croissant' },
  { id: 'desc', label: 'Prix décroissant' },
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      sheetOpen: false,
      quick: 'Soldes',
      brands: {},
      band: 'all',
      sort: 'pop',
      favs: { effaclar: true },
    };
  }

  money(n) {
    return n.toLocaleString('fr-FR') + ' MAD';
  }

  visible() {
    const picked = Object.keys(this.state.brands).filter((b) => this.state.brands[b]);
    const band = PRICE_BANDS.find((b) => b.id === this.state.band) || PRICE_BANDS[0];
    let list = CATALOGUE.filter((p) => band.test(p));
    if (picked.length) list = list.filter((p) => picked.indexOf(p.brand) !== -1);
    if (this.state.quick === 'Soldes') list = list.filter((p) => p.old);
    if (this.state.quick === 'En stock') list = list.filter((p) => p.stock > 0);
    if (this.state.sort === 'asc') list = list.slice().sort((a, b) => a.price - b.price);
    if (this.state.sort === 'desc') list = list.slice().sort((a, b) => b.price - a.price);
    return list;
  }

  renderVals() {
    const list = this.visible();
    const brandNames = [];
    CATALOGUE.forEach((p) => { if (brandNames.indexOf(p.brand) === -1) brandNames.push(p.brand); });
    const filterCount = Object.keys(this.state.brands).filter((b) => this.state.brands[b]).length
      + (this.state.band === 'all' ? 0 : 1);

    return {
      sheetOpen: this.state.sheetOpen,
      openSheet: () => this.setState({ sheetOpen: true }),
      closeSheet: () => this.setState({ sheetOpen: false }),
      clearAll: () => this.setState({ brands: {}, band: 'all' }),
      filterCount: filterCount,
      hasFilters: filterCount > 0,
      countLabel: list.length + (list.length > 1 ? ' produits' : ' produit'),
      applyLabel: 'Voir ' + list.length + (list.length > 1 ? ' produits' : ' produit'),
      sortLabel: (SORTS.find((s) => s.id === this.state.sort) || SORTS[0]).label,
      cycleSort: () => {
        const i = SORTS.findIndex((s) => s.id === this.state.sort);
        this.setState({ sort: SORTS[(i + 1) % SORTS.length].id });
      },

      quick: ['Soldes', 'En stock', 'Nouveautés', 'Visage', 'Corps'].map((label) => ({
        label: label,
        on: this.state.quick === label ? 'true' : 'false',
        pick: () => this.setState({ quick: this.state.quick === label ? '' : label }),
      })),

      brandRows: brandNames.map((name) => {
        const on = !!this.state.brands[name];
        const next = Object.assign({}, this.state.brands);
        next[name] = !on;
        return {
          name: name,
          on: on ? 'true' : 'false',
          count: CATALOGUE.filter((p) => p.brand === name).length,
          toggle: () => this.setState({ brands: next }),
        };
      }),

      priceRows: PRICE_BANDS.map((b) => ({
        label: b.label,
        on: this.state.band === b.id ? 'true' : 'false',
        pick: () => this.setState({ band: b.id }),
      })),

      items: list.map((p) => {
        const fav = !!this.state.favs[p.key];
        const next = Object.assign({}, this.state.favs);
        next[p.key] = !fav;
        const out = p.stock === 0;
        const low = p.stock > 0 && p.stock <= 5;
        return {
          brand: p.brand,
          name: p.name,
          img: p.img,
          price: this.money(p.price),
          old: p.old ? this.money(p.old) : '',
          onSale: !!p.old,
          offLabel: p.old ? '-' + Math.round((1 - p.price / p.old) * 100) + '%' : '',
          meta: low ? 'Plus que ' + p.stock : p.size,
          metaColor: low ? '#8a5a0f' : '#6a7178',
          ctaLabel: out ? 'Rupture de stock' : 'Ajouter au panier',
          favFill: fav ? '#5e4074' : 'none',
          toggleFav: () => this.setState({ favs: next }),
          add: () => {},
        };
      }),
    };
  }
}
</script>
</body>
</html>
