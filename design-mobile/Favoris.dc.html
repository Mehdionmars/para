<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&family=Poppins:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #373020; font-family: "Poppins", system-ui, sans-serif; }
    a { color: #5e4074; text-decoration: none; }
    a:hover { color: #3b2650; }
    ul { margin: 0; padding: 0; list-style: none; }
    button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
    .brandline { font-family: "Raleway", sans-serif; font-size: 9.5px; font-weight: 600;
                 letter-spacing: .16em; text-transform: uppercase; color: #6f6a63; margin-bottom: 6px; }
    .pname { font-family: "Jost", sans-serif; font-weight: 300; font-size: 14.5px; line-height: 1.3;
             color: #373020; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
             overflow: hidden; min-height: 38px; }
    .price { font-family: "Jost", sans-serif; font-weight: 400; font-size: 22px; letter-spacing: -.01em;
             line-height: 1; color: #5e4074; white-space: nowrap; }
    .price-old { font-size: 12.5px; color: #6f6a63; text-decoration: line-through; }
    .cta { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
           margin-top: auto; padding: 12px 2px 0; border-top: 1px solid rgba(94,64,116,.16);
           color: #5e4074; font-family: "Raleway", sans-serif; font-size: 10.5px; font-weight: 600;
           letter-spacing: .12em; text-transform: uppercase; text-align: left; min-height: 42px; }
    .fav { position: absolute; top: 4px; right: 4px; z-index: 3; width: 30px; height: 30px;
           border-radius: 50%; background: #fff; border: 1px solid rgba(94,64,116,.16);
           box-shadow: 0 2px 6px -2px rgba(55,48,32,.28); display: flex; align-items: center;
           justify-content: center; }
    .badge { display: inline-flex; align-items: center; background: #ff514d; color: #fff;
             font-size: 10.5px; font-weight: 600; letter-spacing: .06em; border-radius: 999px;
             padding: 5px 11px; }
  </style>
</helmet>

<div style="width: 390px; background: #fff; padding-bottom: 34px">

  <header style="display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid rgba(55,48,32,.08)">
    <button aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#373020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 style="flex: 1; font-family: 'Jost', sans-serif; font-weight: 300; font-size: 20px; color: #5e4074; margin: 0">Mes favoris <span style="font-size: 14px; color: #9a958d">{{ countLabel }}</span></h1>
  </header>

  <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
    <div>
      <p style="padding: 14px 14px 0; margin: 0; font-size: 12.5px; line-height: 1.7; color: #6a7178">
        Vos favoris sont gardés sur cet appareil — aucun compte nécessaire.
      </p>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 14px; padding: 18px 14px 26px">
        <sc-for list="{{ items }}" as="p" hint-placeholder-count="4">
          <article style="display: flex; flex-direction: column; min-width: 0">
            <div style="position: relative; aspect-ratio: 1/1; margin-bottom: 14px">
              <img src="{{ p.img }}" alt="" style="width: 100%; height: 100%; object-fit: contain; filter: {{ p.filter }}; opacity: {{ p.opacity }}">
              <sc-if value="{{ p.onSale }}" hint-placeholder-val="{{ true }}">
                <span class="badge" style="position: absolute; top: 0; left: 0">{{ p.offLabel }}</span>
              </sc-if>
              <button class="fav" onClick="{{ p.remove }}" aria-label="Retirer des favoris">
                <svg width="15" height="15" viewBox="0 0 24 24" stroke="#5e4074" stroke-width="1.6" fill="#5e4074" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
              </button>
            </div>
            <div style="display: flex; flex-direction: column; flex: 1">
              <div class="brandline">{{ p.brand }}</div>
              <div class="pname">{{ p.name }}</div>
              <div style="display: flex; align-items: center; gap: 8px; min-height: 16px; margin-top: 5px; font-size: 11.5px; color: {{ p.metaColor }}">{{ p.meta }}</div>
              <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 8px">
                <span class="price">{{ p.price }}</span>
                <span class="price-old">{{ p.old }}</span>
              </div>
              <button class="cta" onClick="{{ p.add }}">
                <span>{{ p.ctaLabel }}</span>
                <sc-if value="{{ p.inStock }}" hint-placeholder-val="{{ true }}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
                </sc-if>
              </button>
            </div>
          </article>
        </sc-for>
      </div>

      <div style="padding: 0 14px">
        <button onClick="{{ addAll }}" style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 52px; border-radius: 999px; background: #5e4074; color: #fff; font-family: 'Raleway', sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase">
          {{ addAllLabel }}
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="padding: 66px 32px; text-align: center">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#c9c3ba" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      <h2 style="font-family: 'Jost', sans-serif; font-weight: 300; font-size: 21px; color: #5e4074; margin: 18px 0 8px">Aucun favori pour le moment</h2>
      <p style="font-size: 13.5px; line-height: 1.7; color: #6a7178; margin: 0 0 22px">
        Touchez le cœur sur un produit pour le retrouver ici, même après avoir fermé le site.
      </p>
      <button style="min-height: 48px; padding: 0 26px; border-radius: 999px; background: #5e4074; color: #fff; font-family: 'Raleway', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase">
        Voir le catalogue
      </button>
    </div>
  </sc-if>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
const FAVS = [
  { key: 'effaclar', brand: 'La Roche-Posay', name: 'Effaclar Gel Moussant Purifiant', price: 226, old: 348, size: '400 ml', img: 'effaclar.jpg', stock: 12 },
  { key: 'capital', brand: 'Vichy', name: 'Capital Soleil Crème Solaire Onctueuse SPF50+', price: 76, old: 108, size: '50 ml', img: 'capital-soleil.jpg', stock: 4 },
  { key: 'omega3', brand: 'Solgar', name: 'Oméga 3 Capsules', price: 270, old: null, size: '30 capsules', img: 'omega3.jpg', stock: 0 },
  { key: 'parodontax', brand: 'Parodontax', name: 'Dentifrice Complete Protection', price: 54, old: null, size: '75 ml', img: 'parodontax.jpg', stock: 15 },
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { removed: {}, added: 0 };
  }

  money(n) {
    return n.toLocaleString('fr-FR') + ' MAD';
  }

  renderVals() {
    const list = FAVS.filter((p) => !this.state.removed[p.key]);
    const available = list.filter((p) => p.stock > 0);

    return {
      hasItems: list.length > 0,
      isEmpty: list.length === 0,
      countLabel: list.length ? '(' + list.length + ')' : '',
      addAllLabel: 'Tout ajouter au panier · ' + available.length,
      addAll: () => this.setState({ added: this.state.added + available.length }),

      items: list.map((p) => {
        const next = Object.assign({}, this.state.removed);
        next[p.key] = true;
        const out = p.stock === 0;
        const low = p.stock > 0 && p.stock <= 5;
        return {
          brand: p.brand,
          name: p.name,
          img: p.img,
          price: this.money(p.price),
          old: p.old ? this.money(p.old) : '',
          onSale: !!p.old,
          offLabel: p.old ? '-' + Math.round((1 - p.price / p.old) * 100) + '%' : '',
          meta: out ? 'Bientôt de retour' : low ? 'Plus que ' + p.stock : p.size,
          metaColor: low ? '#8a5a0f' : '#6a7178',
          ctaLabel: out ? 'Rupture de stock' : 'Ajouter au panier',
          inStock: !out,
          filter: out ? 'grayscale(.55)' : 'none',
          opacity: out ? 0.7 : 1,
          remove: () => this.setState({ removed: next }),
          add: () => {},
        };
      }),
    };
  }
}
</script>
</body>
</html>
