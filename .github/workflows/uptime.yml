# Uptime monitoring, from outside the building.
#
# ## Why here, and not on the server
#
# Anything running on the box can only tell you the box is fine. It cannot see
# DNS, Cloudflare or the tunnel — and those are exactly what failed: the public
# domain answered 500 for days while every container on the server was healthy
# and nobody was told. A check has to start where a visitor starts.
#
# GitHub Actions is outside, free for this repository, needs no new service and
# no secret: GITHUB_TOKEN can open and close issues, and an issue notifies the
# repository owner by email and in the GitHub app. That is the alert channel.
#
# ## What "down" means
#
# Availability targets get three attempts, 20 seconds apart, before anything is
# declared. A single blip — a tunnel reconnect, a container restart mid-deploy —
# is not an incident, and an alert that cries wolf gets muted, which is worse
# than no alert. The backup target gets one: staleness does not clear in 40s.
#
# One issue per target, found by its title. It is opened on the first failing
# run, noted at most once a day while it stays down, and closed with the outage
# duration when it recovers. The issue *is* the incident record.
#
# ## Known limits, stated rather than discovered
#
# - Scheduled workflows run at best every five minutes and GitHub may delay them
#   under load; this is a ten-minute check, not a pager.
# - GitHub disables scheduled workflows after 60 days with no repository
#   activity. A quiet repo will stop being watched without warning — push, or
#   re-enable it from the Actions tab.

name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          # The end-to-end probe: storefront -> backend -> Postgres, through
          # Cloudflare and the tunnel. A 200 here means a visitor can shop.
          - name: preprod
            url: https://preprod.paradhiver.ma/api/health
            expect: '"status":"ok"'
          # The public domain. Plain page check: it is not guaranteed to be
          # served by this stack, and a health route may not exist wherever
          # it currently points.
          - name: paradhiver.ma
            url: https://paradhiver.ma/
            expect: ''
          # Not an availability check: a freshness check. The route answers
          # `ok` only if a verified database dump completed within the last
          # 26 hours, so this catches a backup that failed *and* one that
          # simply stopped running — a disabled timer, a renamed container, a
          # machine that was off at midnight. One attempt: a stale backup does
          # not recover in forty seconds, and retrying only delays the issue.
          - name: db-backup
            url: https://preprod.paradhiver.ma/api/health/backup
            expect: '"status":"ok"'
            attempts: 1
            title: 'Incident: database backups have stopped'
    steps:
      - name: Probe ${{ matrix.name }}
        id: probe
        env:
          URL: ${{ matrix.url }}
          EXPECT: ${{ matrix.expect }}
          ATTEMPTS: ${{ matrix.attempts || 3 }}
        run: |
          set -u
          status=down
          detail=""
          for attempt in $(seq 1 "$ATTEMPTS"); do
            body=$(curl -sS -L -m 20 -o - -w '\n%{http_code} %{time_total}' "$URL" 2>&1) || true
            meta=$(printf '%s' "$body" | tail -n1)
            code=${meta%% *}
            secs=${meta##* }
            content=$(printf '%s' "$body" | sed '$d')
            if [ "$code" = "200" ] && { [ -z "$EXPECT" ] || printf '%s' "$content" | grep -qF "$EXPECT"; }; then
              status=up
              detail="HTTP $code in ${secs}s"
              break
            fi
            detail="HTTP ${code:-none} (attempt $attempt of $ATTEMPTS)"
            echo "::warning::$URL -> $detail"
            [ "$attempt" -lt "$ATTEMPTS" ] && sleep 20
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "detail=$detail" >> "$GITHUB_OUTPUT"
          echo "$URL -> $status ($detail)"

      - name: Open, update or close the incident
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ matrix.name }}
          # Quoted: an unquoted `: ` inside the expression is read by YAML as a
          # mapping and the whole workflow fails to parse.
          TITLE: "${{ matrix.title || format('Incident: {0} is down', matrix.name) }}"
          ATTEMPTS: ${{ matrix.attempts || 3 }}
          URL: ${{ matrix.url }}
          STATUS: ${{ steps.probe.outputs.status }}
          DETAIL: ${{ steps.probe.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          title="$TITLE"
          now=$(date -u +%Y-%m-%dT%H:%MZ)

          gh label create incident --color B60205 \
            --description "Opened and closed by the Uptime workflow" 2>/dev/null || true

          # Listed by label and matched on the exact title in jq — deliberately
          # not `--search`. GitHub's search index lags a fresh issue by up to a
          # minute or two, so a search would miss the issue the previous run
          # just opened and this run would open a duplicate. There are only
          # ever a handful of open incidents, so listing them all costs nothing.
          number=$(gh issue list --state open --label incident --limit 50 \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)

          if [ "$STATUS" = "down" ]; then
            if [ -z "$number" ]; then
              gh issue create --label incident --title "$title" --body "$(printf '%s\n' \
                "**$URL** failed $ATTEMPTS consecutive check(s)." \
                "" \
                "- First seen: $now" \
                "- Last result: $DETAIL" \
                "- Run: $RUN_URL" \
                "" \
                "This issue stays open while the target is down and closes itself when it recovers.")"
            else
              # At most one "still down" comment a day.
              #
              # This runs every ten minutes. Commenting on every failing run
              # turns a two-day outage into nearly three hundred notifications,
              # and an alert that floods gets muted — after which the *next*
              # incident is missed too. The open issue already says it is down;
              # a daily line is enough to show it is still being watched.
              last=$(gh issue view "$number" --json comments,createdAt \
                --jq '(.comments | map(.createdAt) | last) // .createdAt')
              age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
              if [ "$age" -ge 86400 ]; then
                gh issue comment "$number" --body "Still down at $now — $DETAIL. [run]($RUN_URL)"
              else
                echo "still down; last note on #$number was $((age / 3600))h ago, not repeating it"
              fi
            fi
            exit 1
          fi

          if [ -n "$number" ]; then
            opened=$(gh issue view "$number" --json createdAt --jq .createdAt)
            mins=$(( ( $(date -u +%s) - $(date -u -d "$opened" +%s) ) / 60 ))
            gh issue close "$number" --comment "Recovered at $now — $DETAIL. Down for about ${mins} minutes."
          fi
