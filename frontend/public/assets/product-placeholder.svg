<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Photo du produit à venir">
  <!-- No filled ground: the storefront's product cards are frameless, so a
       solid cream square would draw the one box the card was built to remove.
       A dashed outline says "photo missing" without pretending to be one. -->
  <rect x="26" y="26" width="348" height="348" rx="18" fill="none" stroke="#5E4074" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="9 9"/>
  <g transform="translate(200,182)" fill="none" stroke="#5E4074" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.34">
    <rect x="-34" y="-70" width="68" height="140" rx="14"/>
    <rect x="-14" y="-90" width="28" height="24" rx="4"/>
    <line x1="-34" y1="-24" x2="34" y2="-24"/>
  </g>
  <text x="200" y="286" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="13" font-weight="600" letter-spacing="2.4" fill="#5E4074" opacity="0.5">PHOTO À VENIR</text>
</svg>
