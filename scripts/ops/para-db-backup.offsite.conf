# Drop-in for para-db-backup.service.
# Installed at /etc/systemd/system/para-db-backup.service.d/offsite.conf
#
# Runs after heartbeat.conf (drop-ins apply in name order, and ExecStartPost
# lines run in sequence): only once the dump is verified and recorded locally
# does it leave for R2. See scripts/ops/para-backup-offsite.sh.
#
# A failed upload marks the unit failed, which is visible in `systemctl
# --failed`; the off-site heartbeat stops moving, which is what raises the
# alert. The local backup is already safe on disk by then.

[Service]
ExecStartPost=/usr/local/bin/para-backup-offsite.sh
# Bounds the whole run, dump included. The dump takes seconds and the uploads
# are a few megabytes; a hang on the network must not block tomorrow's backup.
TimeoutStartSec=30min
