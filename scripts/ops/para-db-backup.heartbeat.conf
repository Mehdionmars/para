# Drop-in for para-db-backup.service.
# Installed at /etc/systemd/system/para-db-backup.service.d/heartbeat.conf
#
# A drop-in rather than an edit to the unit or the backup script: it adds one
# step without touching either, and removing this file puts everything back
# exactly as it was.
#
# For a Type=oneshot service, ExecStartPost runs only when ExecStart exited
# successfully — so a heartbeat is only ever written for a dump that was
# produced and verified. See scripts/ops/para-backup-heartbeat.sh.

[Service]
ExecStartPost=/usr/local/bin/para-backup-heartbeat.sh
